<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<title>Friday Night Funkin': ANTIPATHY</title>
<style>
  * { margin: 0; padding: 0; }
  html, body, .game-area, #innergame {
    width: 100%;
    height: 100%;
    touch-action: none;
    -ms-touch-action: none;
  }
  html, body {
    overflow: hidden;
    overscroll-behavior: none;
    background: #000;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .game-area {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #innergame {
    display: block;
    border: 0;
    background: #000;
  }
</style>
</head>
<body>
<div class="game-area">
  <iframe
    id="innergame"
    title="Friday Night Funkin': ANTIPATHY"
    src="https://fnf.kdata1.com/antipathy/2/"
    scrolling="no"
    allow="autoplay; fullscreen; microphone"
    allowfullscreen>
  </iframe>
</div>
<script>
  const GAME_W = 960;
  const GAME_H = 540;

  function sizeGame() {
    const area = document.querySelector(".game-area");
    const frame = document.getElementById("innergame");
    const scale = Math.min(area.clientWidth / GAME_W, area.clientHeight / GAME_H);

    frame.style.width = Math.floor(GAME_W * scale) + "px";
    frame.style.height = Math.floor(GAME_H * scale) + "px";
  }

  sizeGame();
  window.addEventListener("resize", sizeGame);

  function preventGesture(e) {
    e.preventDefault();
  }

  document.addEventListener("touchmove", function(e) {
    if (e.touches.length > 1 || (e.scale !== undefined && e.scale !== 1)) {
      e.preventDefault();
    }
  }, { passive: false });

  document.addEventListener("touchstart", function(e) {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  document.addEventListener("gesturestart", preventGesture);
  document.addEventListener("gesturechange", preventGesture);
  document.addEventListener("gestureend", preventGesture);
</script>
</body>
</html>
