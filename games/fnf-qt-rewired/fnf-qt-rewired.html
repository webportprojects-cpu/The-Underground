<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<title>FNF QT: Rewired</title>
<style>
  * { margin:0; padding:0; }
  html, body, .game-area, #innergame { touch-action:none; -ms-touch-action:none; }
  html, body { width:100%; height:100%; overflow:hidden; overscroll-behavior:none; background:#000; display:flex; align-items:center; justify-content:center; }
  body { flex-direction:column; }
  .game-area { position:fixed; top:0; right:0; bottom:0; left:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  iframe { border:none; display:block; }
  #innergame { width:100%; height:100%; }
</style>
</head>
<body>
<div class="game-area">
<iframe id="innergame" scrolling="no" allow="autoplay; fullscreen; microphone" allowfullscreen></iframe>
</div>
<script>
  // ─── CONFIG ───────────────────────────────────────────────
  // Option A: Load from the external CDN (current setting)
  var GAME_SRC = "https://fnf.kdata1.com/2026/qt/d/";

  // Option B: Self-host — download the game files, put them in
  // a `public/game/` folder in your Vercel project, then use:
  // var GAME_SRC = "/game/";

  var GAME_W = 960;
  var GAME_H = 540;
  // ──────────────────────────────────────────────────────────

  function sizeGame() {
    var area = document.querySelector('.game-area');
    var iframe = document.getElementById('innergame');
    if (!area || !iframe) return;
    var cw = area.clientWidth;
    var ch = area.clientHeight;
    var scale = Math.min(cw / GAME_W, ch / GAME_H);
    iframe.style.width = Math.floor(GAME_W * scale) + 'px';
    iframe.style.height = Math.floor(GAME_H * scale) + 'px';
  }

  sizeGame();
  window.addEventListener('resize', sizeGame);
  document.getElementById('innergame').src = GAME_SRC;

  // Block pinch-zoom / gesture scaling on mobile
  function prevent(e){ e.preventDefault(); }
  document.addEventListener('touchmove', function(e){
    if(e.touches.length > 1 || (e.scale !== undefined && e.scale !== 1)) e.preventDefault();
  }, {passive:false});
  document.addEventListener('touchstart', function(e){
    if(e.touches.length > 1) e.preventDefault();
  }, {passive:false});
  document.addEventListener('gesturestart', prevent);
  document.addEventListener('gesturechange', prevent);
  document.addEventListener('gestureend', prevent);
</script>
</body>
</html>
