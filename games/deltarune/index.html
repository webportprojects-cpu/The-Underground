<!DOCTYPE html>
<html>
<head>
  <base href="https://cdn.jsdelivr.net/gh/technonyte00/deltarune@main/">
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deltarune</title>
  <link rel="icon" type="image/png" href="icons/1.png">
  <link rel="stylesheet" href="style.css">
  <style>
    #chapter-status {
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: 1rem;
      max-width: calc(100vw - 2rem);
      transform: translateX(-50%);
      padding: 0.7rem 1rem;
      border: 1px solid #fff;
      background: #111;
      color: #fff;
      font: 16px sans-serif;
      text-align: center;
    }

    #chapter-status[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="logo.png" alt="Deltarune" class="logo">
  </div>

  <div class="menu">
    <a href="#" data-chapter="1" class="row">
      <span class="chapter">Chapter 1</span>
      <span class="title">The Beginning</span>
      <img src="icons/1.png" alt="">
    </a>
    <a href="#" data-chapter="2" class="row">
      <span class="chapter">Chapter 2</span>
      <span class="title">A Cyber's World</span>
      <img src="icons/2.png" alt="">
    </a>
    <a href="#" data-chapter="3" class="row">
      <span class="chapter">Chapter 3</span>
      <span class="title">Late Night</span>
      <img src="icons/3.png" alt="">
    </a>
    <a href="#" data-chapter="4" class="row">
      <span class="chapter">Chapter 4</span>
      <span class="title">Prophecy</span>
      <img src="icons/4.png" alt="">
    </a>
    <a href="javascript:alert('Chapter 5 coming soon!')" class="disabled-row">
      <span class="chapter">Chapter 5</span>
      <span class="disabled-title">--</span>
      <img src="icons/0.png" alt="">
    </a>
    <a href="javascript:alert('Chapter 6 coming soon!')" class="disabled-row">
      <span class="chapter">Chapter 6</span>
      <span class="disabled-title">--</span>
      <img src="icons/0.png" alt="">
    </a>
    <a href="javascript:alert('Chapter 7 coming soon!')" class="disabled-row">
      <span class="chapter">Chapter 7</span>
      <span class="disabled-title">--</span>
      <img src="icons/0.png" alt="">
    </a>
  </div>

  <audio id="drone" controls loop autoplay hidden>
    <source src="audios/AUDIO_DRONE.ogg" type="audio/ogg">
  </audio>
  <button id="mute" type="button" aria-label="Toggle menu sound">🔊</button>
  <div id="chapter-status" role="status" aria-live="polite" hidden></div>

  <script>
    const audio = document.getElementById('drone');
    const mute = document.getElementById('mute');
    const chapterStatus = document.getElementById('chapter-status');
    let gamestarted = false;
    let isLoadingChapter = false;

    mute.addEventListener('click', () => {
      if (!gamestarted) {
        audio.muted = !audio.muted;
        updateButton();
      }
    });

    function updateButton() {
      if (!gamestarted) {
        mute.textContent = audio.muted ? '🔊' : '🔇';
      }
    }

    updateButton();

    function loadChapter(chapter) {
      if (gamestarted || isLoadingChapter) return;
      isLoadingChapter = true;
      chapterStatus.hidden = false;
      chapterStatus.textContent = `Loading Chapter ${chapter}…`;

      fetch(`chapter${chapter}/index.html`)
        .then((response) => {
          if (!response.ok) throw new Error(`Chapter request failed (${response.status})`);
          return response.text();
        })
        .then((html) => {
          const chapterDocument = new DOMParser().parseFromString(html, 'text/html');
          chapterDocument.querySelectorAll('script').forEach((script) => {
            const source = script.getAttribute('src') || '';
            const code = script.textContent || '';
            if (
              source.includes('googlesyndication.com') ||
              code.includes('adsbygoogle') ||
              code.includes('ogalert')
            ) {
              script.remove();
            }
          });

          gamestarted = true;
          document.documentElement.innerHTML = chapterDocument.documentElement.innerHTML;
          document.documentElement.querySelectorAll('script').forEach((oldScript) => {
            const newScript = document.createElement('script');
            if (oldScript.src) {
              newScript.src = oldScript.src;
            } else {
              newScript.textContent = oldScript.textContent;
            }
            document.body.appendChild(newScript);
          });
        })
        .catch((error) => {
          console.error('Unable to load the selected Deltarune chapter.', error);
          isLoadingChapter = false;
          chapterStatus.textContent = `Chapter ${chapter} could not be loaded. Check your connection and try again.`;
        });
    }

    const menumoveaudio = new Audio('audios/snd_menumove.mp3');
    const menuselectaudio = new Audio('audios/snd_select.mp3');
    document.querySelectorAll('.row').forEach((row) => {
      row.addEventListener('mouseenter', () => {
        if (!gamestarted) {
          menumoveaudio.play();
          if (selectedChapter !== null) {
            document.querySelectorAll('.row')[selectedChapter]?.classList.remove('selected');
          }
        }
      });
      row.addEventListener('click', (event) => {
        if (gamestarted) return;
        event.preventDefault();
        menuselectaudio.play();
        loadChapter(Number(row.dataset.chapter));
      });
    });

    let selectedChapter = null;
    document.addEventListener('keydown', (event) => {
      if (gamestarted) return;
      const rows = document.querySelectorAll('.row');
      if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
        event.preventDefault();
        const direction = event.key === 'ArrowUp' ? -1 : 1;
        const nextChapter = selectedChapter === null
          ? 0
          : (selectedChapter + direction + rows.length) % rows.length;
        if (selectedChapter !== null) rows[selectedChapter]?.classList.remove('selected');
        selectedChapter = nextChapter;
        rows[selectedChapter]?.classList.add('selected');
        menumoveaudio.play();
      } else if (event.key === 'Enter' && selectedChapter !== null) {
        rows[selectedChapter]?.click();
      }
    });
  </script>
</body>
</html>
